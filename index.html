<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booo!! Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Gun.js Real-Time Cloud Database for Global User Accounts & Live Chat -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <!-- PeerJS for 0ms Listen Together Private Studio Sync -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- YouTube Music / InnerTube Audio Stream Core -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --easing: cubic-bezier(0.22, 1, 0.36, 1);
            --glass: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
            --glass-border: rgba(255, 255, 255, 0.22);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: #030306; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }

        /* In-Viewport 1x1 Stealth InnerTube Mount (Prevents Mobile WebView Autoplay Block) */
        #innerTubeMount {
            position: fixed; bottom: 0; right: 0; width: 2px; height: 2px;
            opacity: 0.001; pointer-events: none; z-index: -10; overflow: hidden;
        }

        /* --- AMBIENT COLOR FLOW BACKGROUND --- */
        .ambient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #030306; }
        .amb-orb {
            position: absolute; border-radius: 50%; filter: blur(75px); opacity: 0.44;
            background-size: cover; background-position: center; will-change: transform;
            animation: ambientFloat 18s infinite alternate ease-in-out;
            transition: background-image 1s ease;
        }
        .orb-1 { width: 330px; height: 330px; top: -10%; left: -10%; background-color: #ff2d55; }
        .orb-2 { width: 360px; height: 360px; bottom: -12%; right: -10%; background-color: #5e5ce6; animation-delay: -6s; }
        @keyframes ambientFloat { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(30px, -25px, 0) scale(1.12); } }

        /* --- 1. MANDATORY ACCOUNT AUTH SCREEN (CLEAN PLACEHOLDERS) --- */
        #authScreen {
            position: fixed; inset: 0; z-index: 9000;
            background: radial-gradient(circle at 50% 20%, #1a0b2e 0%, #030306 75%);
            display: flex; align-items: center; justify-content: center; padding: 22px;
            transition: opacity 0.4s ease, transform 0.4s var(--easing);
        }
        #authScreen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .auth-glass-card {
            width: 100%; max-width: 360px; padding: 30px 24px 26px; border-radius: 30px;
            background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); text-align: center;
        }
        .auth-title { font-size: 24px; font-weight: 900; margin-top: 14px; margin-bottom: 4px; }
        .auth-sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
        .auth-input {
            width: 100%; padding: 13px 16px; border-radius: 16px; background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 15px; font-weight: 600; outline: none; margin-bottom: 12px;
            user-select: text;
        }
        .auth-input:focus { border-color: #ff2d55; }
        .password-warning-box {
            padding: 11px 14px; border-radius: 14px; margin-bottom: 18px;
            background: rgba(255, 59, 48, 0.16); border: 1px solid rgba(255, 59, 48, 0.45);
            color: #ff6961; font-size: 12px; font-weight: 700; text-align: left; display: flex; gap: 9px; line-height: 1.4;
        }
        .auth-submit-btn {
            width: 100%; padding: 14px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, #ff2d55, #bf5af2); color: #fff; font-size: 15.5px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 45, 85, 0.4);
        }
        #authErrorMsg { color: #ff453a; font-size: 12.5px; font-weight: 700; margin-bottom: 10px; display: none; }

        /* --- TOP BAR WITH ROTATING EDGE LINE "Booo!!" LIQUID GLASS BOX --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 40;
            padding: 14px 14px 12px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(3,3,6,0.92) 0%, rgba(3,3,6,0) 100%); backdrop-filter: blur(12px);
        }
        .booo-edge-box {
            position: relative; padding: 2.2px; border-radius: 20px; overflow: hidden; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.55); display: inline-flex; align-items: center; justify-content: center;
        }
        .booo-edge-box::before {
            content: ''; position: absolute; width: 260%; height: 260%; top: -80%; left: -80%;
            background: conic-gradient(from 0deg, #ff2d55, #ff9f0a, #30d158, #00f2fe, #5e5ce6, #bf5af2, #ff2d55);
            animation: edgeSpin 2.6s linear infinite; z-index: 0;
        }
        @keyframes edgeSpin { 100% { transform: rotate(360deg); } }
        .booo-inner-glass {
            position: relative; z-index: 1; padding: 6px 15px; border-radius: 18px;
            background: rgba(12, 12, 20, 0.88); backdrop-filter: blur(20px); font-size: 18.5px; font-weight: 900; color: #fff;
        }

        .nav-actions { display: flex; align-items: center; gap: 6px; }
        .glass-pill {
            padding: 8px 11px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; cursor: pointer;
        }
        .glass-pill.admin-pill {
            background: linear-gradient(135deg, rgba(255, 214, 10, 0.3), rgba(255, 45, 85, 0.2));
            border-color: #ffd60a; color: #ffd60a; display: none;
            box-shadow: 0 0 15px rgba(255, 214, 10, 0.35);
        }
        .glass-pill i.fa-instagram { font-size: 14px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); -webkit-background-clip: text; color: transparent; }
        .glass-pill i.fa-users-rays { color: #30d158; font-size: 12px; }
        .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #30d158; box-shadow: 0 0 8px #30d158; display: none; }
        .sync-dot.online { display: inline-block; }

        /* --- MAIN APP SCROLL --- */
        .main-scroll { position: relative; z-index: 10; height: 100vh; overflow-y: auto; padding: 74px 18px 160px; scroll-behavior: smooth; }
        .main-scroll::-webkit-scrollbar { display: none; }

        #globalNoticeBanner {
            display: none; padding: 11px 15px; border-radius: 16px; margin-bottom: 16px;
            background: linear-gradient(135deg, rgba(255, 214, 10, 0.22), rgba(255, 45, 85, 0.22));
            border: 1px solid rgba(255, 214, 10, 0.55); font-size: 12.5px; font-weight: 700;
            align-items: center; justify-content: space-between; gap: 10px;
        }

        /* Clean Search Box */
        .search-box {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; padding: 11px 15px; display: flex; align-items: center; margin-bottom: 16px;
            box-shadow: 0 14px 32px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.18);
        }
        .search-box i { color: rgba(255,255,255,0.6); font-size: 16px; }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15.5px; margin-left: 10px; outline: none; user-select: text; }
        .search-go { background: linear-gradient(135deg, #ff2d55, #bf5af2); border: none; color: #fff; padding: 9px 18px; border-radius: 13px; font-weight: 800; font-size: 13px; cursor: pointer; }

        /* Navigation Tabs */
        .user-library-bar { display: flex; gap: 7px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
        .user-library-bar::-webkit-scrollbar { display: none; }
        .lib-tab-btn {
            flex: 1; justify-content: center;
            padding: 9px 11px; border-radius: 15px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
            display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap;
        }
        .lib-tab-btn.active { background: rgba(255, 45, 85, 0.24); border-color: #ff2d55; }
        .lib-tab-btn.owner-tab { border-color: rgba(255, 214, 10, 0.5); background: linear-gradient(135deg, rgba(255, 214, 10, 0.18), rgba(255, 45, 85, 0.12)); }
        .like-count-pill { background: rgba(255, 45, 85, 0.3); color: #fff; padding: 1px 6px; border-radius: 8px; font-size: 10.5px; font-weight: 900; }

        /* --- CLEAN AESTHETIC SEARCH STUDIO EMPTY STATE (NO SUGGESTED SONGS!) --- */
        .search-empty-studio {
            padding: 42px 22px; border-radius: 28px; text-align: center; margin: 12px 0 24px;
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.14);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        }
        .studio-pulse-circle {
            width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 16px;
            background: linear-gradient(135deg, rgba(255,45,85,0.22), rgba(191,90,242,0.22));
            border: 1px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #fff;
            box-shadow: 0 0 30px rgba(255,45,85,0.3);
        }
        .vibe-shuffle-pill {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
            padding: 6px 14px; border-radius: 20px; font-size: 11.5px; font-weight: 800;
            background: rgba(48, 209, 88, 0.15); border: 1px solid rgba(48, 209, 88, 0.4); color: #30d158;
        }

        /* --- ROYAL PREMIUM OWNER AESTHETIC PROFILE CARD --- */
        .aesthetic-profile-card {
            position: relative; overflow: hidden; border-radius: 28px; padding: 24px 20px; margin-bottom: 20px;
            background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.24); box-shadow: 0 22px 50px rgba(0,0,0,0.65);
            text-align: center;
        }
        .aesthetic-profile-card.owner-edition {
            background: radial-gradient(circle at 50% 0%, rgba(255, 214, 10, 0.25), rgba(191, 90, 242, 0.15), rgba(10, 10, 18, 0.92));
            border: 1.5px solid rgba(255, 214, 10, 0.65);
            box-shadow: 0 22px 55px rgba(255, 214, 10, 0.18), inset 0 1px 3px rgba(255, 255, 255, 0.45);
        }
        .profile-avatar-ring {
            width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px; padding: 3px;
            background: linear-gradient(135deg, #ff2d55, #bf5af2, #00f2fe);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .owner-edition .profile-avatar-ring {
            background: conic-gradient(from 0deg, #ffd60a, #ff2d55, #bf5af2, #00f2fe, #ffd60a);
            animation: edgeSpin 4s linear infinite;
            box-shadow: 0 0 25px rgba(255, 214, 10, 0.5);
        }
        .profile-avatar-inner {
            width: 100%; height: 100%; border-radius: 50%; background: #0c0c14;
            display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #fff;
        }
        .owner-crown-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px;
            background: linear-gradient(90deg, #ffd60a, #ff9f0a); color: #000;
            font-size: 10.5px; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase;
            margin-bottom: 8px; box-shadow: 0 4px 15px rgba(255, 214, 10, 0.45);
        }
        .profile-uname { font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .verified-tick { color: #00d2ff; font-size: 17px; }
        .owner-edition .verified-tick { color: #ffd60a; filter: drop-shadow(0 0 8px rgba(255,214,10,0.6)); }
        .profile-bio { font-size: 12.5px; color: rgba(255,255,255,0.7); margin: 6px 0 16px; }
        .profile-stats-row {
            display: flex; justify-content: space-around; padding: 12px 10px; border-radius: 18px;
            background: rgba(0,0,0,0.38); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px;
        }
        .p-stat-num { font-size: 17px; font-weight: 900; color: #fff; }
        .owner-edition .p-stat-num { color: #ffd60a; }
        .p-stat-lbl { font-size: 10.5px; color: rgba(255,255,255,0.55); font-weight: 700; }

        .section-heading { font-size: 18px; font-weight: 800; margin-bottom: 13px; display: flex; justify-content: space-between; align-items: center; }
        .section-sub { font-size: 11.5px; color: rgba(255,255,255,0.48); font-weight: 700; text-transform: uppercase; }

        .song-row {
            display: flex; align-items: center; padding: 10px 12px; margin-bottom: 10px; border-radius: 16px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); cursor: pointer;
        }
        .song-row:active { background: rgba(255,255,255,0.12); transform: scale(0.99); }
        .song-row img { width: 52px; height: 52px; border-radius: 12px; margin-right: 14px; object-fit: cover; }
        .song-meta { flex: 1; overflow: hidden; }
        .song-meta h4 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .song-meta p { font-size: 13px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-actions { display: flex; align-items: center; gap: 10px; }
        .heart-btn { font-size: 17px; color: rgba(255,255,255,0.35); padding: 6px; }
        .heart-btn.liked { color: #ff2d55; transform: scale(1.15); }
        .play-circle { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }

        /* --- SOCIAL COMMUNITY: FOLLOW USERS & LIVE REAL-TIME CLOUD CHAT --- */
        .social-card {
            padding: 16px; border-radius: 22px; margin-bottom: 16px;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.16);
        }
        .user-follow-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .user-follow-row:last-child { border-bottom: none; }
        .follow-btn {
            padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: 800;
            background: linear-gradient(135deg, #ff2d55, #bf5af2); color: #fff; border: none; cursor: pointer;
        }
        .follow-btn.following { background: rgba(255,255,255,0.15); color: #30d158; border: 1px solid #30d158; }

        .chat-messages-box {
            height: 250px; overflow-y: auto; padding: 12px; border-radius: 18px;
            background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.12); margin-bottom: 10px;
            display: flex; flex-direction: column; gap: 9px; scroll-behavior: smooth;
        }
        .chat-bubble {
            padding: 10px 14px; border-radius: 16px; max-width: 84%; font-size: 13.5px; line-height: 1.38;
            background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); align-self: flex-start;
        }
        .chat-bubble.me {
            background: linear-gradient(135deg, rgba(255,45,85,0.38), rgba(191,90,242,0.38));
            border-color: rgba(255,45,85,0.55); align-self: flex-end;
        }
        .chat-bubble.owner-msg {
            background: linear-gradient(135deg, rgba(255, 214, 10, 0.28), rgba(255, 45, 85, 0.25));
            border: 1px solid rgba(255, 214, 10, 0.65);
            box-shadow: 0 4px 15px rgba(255, 214, 10, 0.15);
        }
        .chat-sender { font-size: 11px; font-weight: 800; color: #00d2ff; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
        .chat-sender.owner-name { color: #ffd60a; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input {
            flex: 1; padding: 12px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.22);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 14px; outline: none; user-select: text;
        }
        .chat-send-btn {
            padding: 0 20px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, #30d158, #00b09b); color: #000; font-weight: 900; font-size: 15px; cursor: pointer;
        }

        .support-card {
            margin-top: 22px; padding: 18px; border-radius: 22px; background: var(--glass); border: 1px solid var(--glass-border); text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .support-card h4 { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; }
        .insta-grid { display: flex; gap: 10px; }
        .insta-chip { flex: 1; padding: 11px 10px; border-radius: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }

        /* --- SUPER ADMIN OWNER DASHBOARD --- */
        #superAdminScreen {
            position: fixed; inset: 0; z-index: 550; background: rgba(4, 4, 9, 0.97); backdrop-filter: blur(40px);
            transform: translateY(100%); transition: transform 0.4s var(--easing); display: flex; flex-direction: column; padding: 20px 18px 28px; overflow-y: auto;
        }
        #superAdminScreen.active { transform: translateY(0); }
        .admin-stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .admin-stat-box { padding: 12px 8px; border-radius: 18px; text-align: center; background: linear-gradient(145deg, rgba(255,214,10,0.18), rgba(255,255,255,0.03)); border: 1px solid rgba(255,214,10,0.4); }
        .admin-stat-num { font-size: 20px; font-weight: 900; color: #ffd60a; }
        .admin-stat-lbl { font-size: 10px; color: rgba(255,255,255,0.7); font-weight: 700; margin-top: 3px; }
        .user-db-card { padding: 12px; border-radius: 16px; margin-bottom: 9px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); display: flex; justify-content: space-between; align-items: center; }
        .user-db-meta h4 { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .user-db-meta p { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 3px; line-height: 1.35; }

        /* --- AESTHETIC FULL-SCREEN LISTEN TOGETHER STUDIO PAGE --- */
        #listenRoomScreen {
            position: fixed; inset
