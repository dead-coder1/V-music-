<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Music UI - Full Songs Fixed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Exact Apple Typography & Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #fff; overflow: hidden; }

        /* --- SEARCH SCREEN --- */
        .search-screen { padding: 40px 20px 100px; height: 100vh; overflow-y: auto; }
        .search-screen h1 { font-size: 34px; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.5px; }
        
        .search-bar { background: #1c1c1e; border-radius: 10px; padding: 10px 15px; display: flex; align-items: center; margin-bottom: 20px; }
        .search-bar i { color: #8e8e93; font-size: 16px; }
        .search-bar input { flex: 1; background: transparent; border: none; color: #fff; font-size: 17px; margin-left: 10px; outline: none; }
        .search-bar input::placeholder { color: #8e8e93; }

        .search-results { display: flex; flex-direction: column; }
        .song-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 0.5px solid #2c2c2e; cursor: pointer; }
        .song-item img { width: 50px; height: 50px; border-radius: 6px; margin-right: 15px; object-fit: cover; }
        .song-item-info { flex: 1; overflow: hidden; }
        .song-item-info h4 { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .song-item-info p { font-size: 14px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- MINI PLAYER --- */
        .mini-player { position: fixed; bottom: 10px; left: 10px; right: 10px; height: 64px; background: rgba(30,30,30,0.85); backdrop-filter: blur(20px); border-radius: 14px; display: none; align-items: center; padding: 0 15px; z-index: 50; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .mini-player img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; margin-right: 12px; }
        .mini-info { flex: 1; overflow: hidden; }
        .mini-info h4 { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-play-btn { color: #fff; font-size: 24px; padding: 10px; }

        /* --- FULL PLAYER --- */
        .full-player { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; overflow: hidden; }
        .full-player.active { transform: translateY(0); }
        
        .player-bg { position: absolute; top: -20%; left: -20%; width: 140%; height: 140%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.4); z-index: -1; transition: background-image 0.5s ease; }
        
        .player-header { padding: 30px 20px 10px; display: flex; justify-content: center; position: relative; z-index: 5; }
        .close-player { width: 35px; height: 5px; background: rgba(255,255,255,0.4); border-radius: 5px; cursor: pointer; }

        .album-art-large { width: 100%; aspect-ratio: 1/1; max-width: 350px; margin: 30px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 5;}
        .album-art-large.playing { transform: scale(1.05); }
        .album-art-large img { width: 100%; height: 100%; object-fit: cover; }

        .player-controls-wrap { padding: 0 30px; margin-top: auto; margin-bottom: 50px; z-index: 5; }
        .player-song-info { margin-bottom: 25px; }
        .player-text h2 { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .player-text p { font-size: 18px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-container { margin-bottom: 30px; }
        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; position: relative; }
        .progress { width: 0%; height: 100%; background: #fff; border-radius: 4px; position: relative; }
        .time { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 8px; font-weight: 500; }

        .playback-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 40px; }
        .playback-controls i { font-size: 28px; color: #fff; cursor: pointer;}
        .playback-controls .play-pause { font-size: 42px; }

        .bottom-actions { display: flex; justify-content: center; color: rgba(255,255,255,0.5); font-size: 20px; }
        .lyrics-btn { cursor: pointer; transition: 0.2s; }
        .lyrics-btn.active { color: #fff; }

        /* --- LYRICS UI (Word-by-Word Engine) --- */
        .lyrics-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; background: rgba(0,0,0,0.4); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
        .lyrics-screen.active { opacity: 1; pointer-events: auto; }
        
        .lyrics-content { flex: 1; overflow-y: auto; padding: 100px 20px 150px; scroll-behavior: smooth; }
        .lyrics-content::-webkit-scrollbar { display: none; }
        
        .lyric-line { 
            font-size: 28px; font-weight: 700; 
            background: rgba(255,255,255,0.3); 
            -webkit-background-clip: text; 
            color: transparent; 
            margin-bottom: 25px; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); line-height: 1.3; transform-origin: left; 
        }
        .lyric-line.active { transform: scale(1.05); text-shadow: 0 4px 20px rgba(255,255,255,0.1); }

        #loading { text-align: center; color: #8e8e93; font-size: 14px; margin-top: 30px; display: none; }
    </style>
</head>
<body>

    <div class="search-screen">
        <h1>Search</h1>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Artists, Songs, Lyrics">
        </div>
        <div id="loading"><i class="fas fa-spinner fa-spin"></i> Fetching Full Songs...</div>
        <div class="search-results" id="resultsList"></div>
    </div>

    <div class="mini-player" id="miniPlayer">
        <img id="miniCover" src="">
        <div class="mini-info" id="openFullPlayer"><h4 id="miniTitle">Song Title</h4></div>
        <i class="fas fa-play mini-play-btn" id="miniPlayBtn"></i>
    </div>

    <div class="full-player" id="fullPlayer">
        <div class="player-bg" id="playerBg"></div>
        <div class="player-header"><div class="close-player" id="closeFullPlayer"></div></div>
        
        <div class="lyrics-screen" id="lyricsScreen">
            <div class="lyrics-content" id="lyricsContent">
                <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 18px; margin-top: 50vh;">Search a song to view lyrics</div>
            </div>
        </div>

        <div class="album-art-large" id="largeCoverContainer"><img id="largeCover" src=""></div>

        <div class="player-controls-wrap">
            <div class="player-song-info">
                <div class="player-text">
                    <h2 id="fullTitle">Title</h2>
                    <p id="fullArtist">Artist</p>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"><div class="progress" id="progress"></div></div>
                <div class="time"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
            </div>
            <div class="playback-controls">
                <i class="fas fa-backward-step" id="prevBtn"></i>
                <i class="fas fa-play play-pause" id="mainPlayBtn"></i>
                <i class="fas fa-forward-step" id="nextBtn"></i>
            </div>
            <div class="bottom-actions">
                <i class="fas fa-quote-left lyrics-btn" id="lyricsToggle"></i>
            </div>
        </div>
    </div>

    <audio id="audio" src=""></audio>

    <script>
        const audio = document.getElementById('audio');
        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const loading = document.getElementById('loading');
        
        const miniPlayer = document.getElementById('miniPlayer');
        const fullPlayer = document.getElementById('fullPlayer');
        const lyricsScreen = document.getElementById('lyricsScreen');
        const lyricsContent = document.getElementById('lyricsContent');
        const progress = document.getElementById('progress');

        let songs = [];
        let songIndex = 0;
        let isPlaying = false;
        let parsedLyrics = [];

        // --- FETCH FULL SONGS (CRASH-PROOF LOGIC) ---
        async function fetchSongs(query) {
            loading.style.display = 'block'; resultsList.innerHTML = '';
            try {
                let res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}`);
                let data = await res.json();
                
                if (data.success && data.data.results.length > 0) {
                    
                    // Naya Smart Filter
                    let tempSongs = data.data.results.map(track => {
                        let highResImg = 'https://via.placeholder.com/500';
                        if (track.image && track.image.length > 0) {
                            highResImg = track.image.find(i => i.quality === '500x500')?.url || track.image[track.image.length - 1].url;
                        }

                        let fullAudio = '';
                        if (track.downloadUrl && track.downloadUrl.length > 0) {
                            fullAudio = track.downloadUrl.find(a => a.quality === '320kbps')?.url || track.downloadUrl[track.downloadUrl.length - 1].url;
                        }

                        let artistName = track.artists.primary ? track.artists.primary.map(a=>a.name).join(', ') : "Unknown Artist";
                        return { name: track.name.replace(/&quot;/g, '"'), artist: artistName, img: highResImg, src: fullAudio };
                    });

                    // Sirf wahi gaane rakho jinka full audio valid hai
                    songs = tempSongs.filter(song => song.src && song.src !== '');

                    if (songs.length === 0) {
                        resultsList.innerHTML = '<p style="color:#ff3b30; text-align:center;">Full versions not available for this search.</p>';
                    } else {
                        resultsList.innerHTML = '';
                        songs.forEach((song, i) => {
                            let div = document.createElement('div'); div.className = 'song-item';
                            div.innerHTML = `<img src="${song.img}"><div class="song-item-info"><h4>${song.name}</h4><p>${song.artist}</p></div>`;
                            div.onclick = () => { songIndex = i; loadSong(songs[songIndex]); playSong(); miniPlayer.style.display = 'flex'; };
                            resultsList.appendChild(div);
                        });
                    }

                } else {
                    resultsList.innerHTML = '<p style="color:#ff3b30; text-align:center;">No results found.</p>';
                }
            } catch (e) {
                // Agar JioSaavn completely down ho, tabhi error aayega
                resultsList.innerHTML = '<p style="color:#ff3b30; text-align:center;">Server is busy. Try searching again.</p>';
            }
            loading.style.display = 'none';
        }
        
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && searchInput.value.trim() !== '') fetchSongs(searchInput.value); });

        // --- FETCH LYRICS (LRCLIB) ---
        async function fetchLyrics(songName, artistName) {
            parsedLyrics = []; lyricsContent.innerHTML = `<div style="text-align:center; color:#8e8e93; margin-top:50vh;">Loading Lyrics...</div>`;
            try {
                let cleanArtist = artistName.split(',')[0];
                let res = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(songName)}&artist_name=${encodeURIComponent(cleanArtist)}`);
                let data = await res.json();
                if(data && data.length > 0 && data[0].syncedLyrics) parseLRC(data[0].syncedLyrics);
                else lyricsContent.innerHTML = `<div style="text-align:center; color:#8e8e93; margin-top:50vh;">Lyrics not available</div>`;
            } catch(e) { lyricsContent.innerHTML = `<div style="text-align:center; color:#8e8e93; margin-top:50vh;">Error loading lyrics</div>`; }
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n'); lyricsContent.innerHTML = '';
            lines.forEach((line) => {
                const match = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
                if (match) {
                    let min = parseInt(match[1]); let sec = parseInt(match[2]); let ms = parseInt(match[3]); let text = match[4].trim();
                    let timeInSec = (min * 60) + sec + (ms / (ms.toString().length === 3 ? 1000 : 100));
                    if(text !== "") {
                        parsedLyrics.push({ time: timeInSec, text: text });
                        let p = document.createElement('p'); p.className = 'lyric-line'; p.id = `line-${parsedLyrics.length - 1}`; p.innerText = text;
                        lyricsContent.appendChild(p);
                    }
                }
            });
            let spacer = document.createElement('div'); spacer.style.height = "50vh"; lyricsContent.appendChild(spacer);
        }

        // --- PLAYER CONTROLS ---
        function loadSong(song) {
            document.getElementById('miniTitle').innerText = song.name; document.getElementById('miniCover').src = song.img;
            document.getElementById('fullTitle').innerText = song.name; document.getElementById('fullArtist').innerText = song.artist;
            document.getElementById('largeCover').src = song.img; audio.src = song.src;
            document.getElementById('playerBg').style.backgroundImage = `url('${song.img}')`;
            fetchLyrics(song.name, song.artist);
        }

        function togglePlay() { isPlaying ? pauseSong() : playSong(); }
        function playSong() { 
            isPlaying = true; 
            document.getElementById('miniPlayBtn').className = 'fas fa-pause mini-play-btn'; 
            document.getElementById('mainPlayBtn').className = 'fas fa-pause play-pause'; 
            document.getElementById('largeCoverContainer').classList.add('playing'); 
            audio.play(); 
        }
        function pauseSong() { 
            isPlaying = false; 
            document.getElementById('miniPlayBtn').className = 'fas fa-play mini-play-btn'; 
            document.getElementById('mainPlayBtn').className = 'fas fa-play play-pause'; 
            document.getElementById('largeCoverContainer').classList.remove('playing'); 
            audio.pause(); 
        }

        document.getElementById('miniPlayBtn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
        document.getElementById('mainPlayBtn').onclick = togglePlay;
        document.getElementById('prevBtn').onclick = () => { songIndex = (songIndex-1+songs.length)%songs.length; loadSong(songs[songIndex]); if(isPlaying)playSong(); };
        document.getElementById('nextBtn').onclick = () => { songIndex = (songIndex+1)%songs.length; loadSong(songs[songIndex]); if(isPlaying)playSong(); };

        // --- WORD BY WORD LYRICS SYNC ENGINE ---
        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.target;
            if(duration) progress.style.width = `${(currentTime/duration)*100}%`;
            let min = Math.floor(currentTime/60); let sec = Math.floor(currentTime%60); document.getElementById('currentTime').innerText = `${min}:${sec<10?'0'+sec:sec}`;
            if(duration) { let dMin = Math.floor(duration/60); let dSec = Math.floor(duration%60); document.getElementById('durationTime').innerText = `${dMin}:${dSec<10?'0'+dSec:dSec}`; }

            if(lyricsScreen.classList.contains('active') && parsedLyrics.length > 0) {
                let activeIndex = -1;
                for(let i=0; i<parsedLyrics.length; i++) { if(currentTime >= parsedLyrics[i].time - 0.2) activeIndex = i; else break; }
                
                if(activeIndex !== -1) {
                    let activeEl = document.getElementById(`line-${activeIndex}`);
                    
                    if(activeEl) {
                        // Reset other lines
                        document.querySelectorAll('.lyric-line').forEach((el, idx) => {
                            if(idx !== activeIndex) {
                                el.classList.remove('active');
                                el.style.background = 'rgba(255,255,255,0.3)';
                                el.style.webkitBackgroundClip = 'text';
                            }
                        });

                        if(!activeEl.classList.contains('active')) {
                            activeEl.classList.add('active');
                            lyricsContent.scrollTo({ top: activeEl.offsetTop - (lyricsContent.clientHeight/2) + 50, behavior: 'smooth' });
                        }

                        // Gradient Fill Logic
                        let currentLineTime = parsedLyrics[activeIndex].time;
                        let nextLineTime = parsedLyrics[activeIndex + 1] ? parsedLyrics[activeIndex + 1].time : currentLineTime + 4;
                        let lineDuration = nextLineTime - currentLineTime;
                        let timePassed = currentTime - currentLineTime;
                        
                        let percentage = Math.max(0, Math.min(100, (timePassed / lineDuration) * 100));
                        activeEl.style.background = `linear-gradient(90deg, #fff ${percentage}%, rgba(255,255,255,0.3) ${percentage}%)`;
                        activeEl.style.webkitBackgroundClip = 'text';
                    }
                }
            }
        });

        document.getElementById('progressBar').onclick = (e) => { if(audio.src) audio.currentTime = (e.offsetX/document.getElementById('progressBar').clientWidth)*audio.duration; };
        audio.onended = () => document.getElementById('nextBtn').click();

        // UI Interactions
        document.getElementById('openFullPlayer').onclick = () => fullPlayer.classList.add('active');
        document.getElementById('closeFullPlayer').onclick = () => { fullPlayer.classList.remove('active'); lyricsScreen.classList.remove('active'); document.getElementById('lyricsToggle').classList.remove('active'); };
        document.getElementById('lyricsToggle').onclick = () => { lyricsScreen.classList.toggle('active'); document.getElementById('lyricsToggle').classList.toggle('active'); };
    </script>
</body>
</html>
