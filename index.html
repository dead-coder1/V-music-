<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Music Streamer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
            padding-bottom: 100px; /* Space for bottom player */
        }
        .header {
            background-color: #1db954;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .search-container {
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .search-container input {
            width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background-color: #282828;
            color: white;
            font-size: 16px;
        }
        .search-container button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: #1db954;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .song-list {
            padding: 0 20px;
        }
        .song-item {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .song-item:active {
            background-color: #282828;
        }
        .song-item img {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            margin-right: 15px;
        }
        .song-info h4 {
            font-size: 16px;
            margin-bottom: 3px;
        }
        .song-info p {
            font-size: 12px;
            color: #b3b3b3;
        }
        /* Bottom Player Fixed */
        .bottom-player {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .player-info {
            display: flex;
            align-items: center;
            width: 60%;
        }
        .player-info img {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            margin-right: 10px;
        }
        .player-text h4 {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-text p {
            font-size: 12px;
            color: #b3b3b3;
        }
        .controls button {
            background: none;
            border: none;
            color: #1db954;
            font-size: 35px;
            cursor: pointer;
        }
        #loading {
            text-align: center;
            display: none;
            margin-top: 20px;
            color: #1db954;
        }
    </style>
</head>
<body>

    <div class="header">Music Stream</div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search for songs, artists...">
        <button onclick="searchSongs()">Search</button>
    </div>

    <div id="loading">Searching online...</div>
    
    <div class="song-list" id="results">
        <!-- Search results will appear here -->
    </div>

    <!-- Fixed Bottom Audio Player -->
    <div class="bottom-player">
        <div class="player-info">
            <img id="now-playing-img" src="https://via.placeholder.com/40x40/1db954/ffffff?text=🎵" alt="Cover">
            <div class="player-text">
                <h4 id="now-playing-title">Not Playing</h4>
                <p id="now-playing-artist">-</p>
            </div>
        </div>
        <div class="controls">
            <button id="playBtn" onclick="togglePlay()">▶️</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');
        const loadingText = document.getElementById('loading');
        
        let isPlaying = false;

        // Search Songs API Fetch
        function searchSongs() {
            let query = searchInput.value.trim();
            if(query === "") return;

            resultsContainer.innerHTML = "";
            loadingText.style.display = "block";

            // Using iTunes Public API for online search and streaming
            let apiUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=15`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    loadingText.style.display = "none";
                    displayResults(data.results);
                })
                .catch(error => {
                    loadingText.style.display = "none";
                    alert("Network error! Check your internet connection.");
                });
        }

        // Show Results on Screen
        function displayResults(songs) {
            if(songs.length === 0) {
                resultsContainer.innerHTML = "<p style='text-align:center;'>No songs found.</p>";
                return;
            }

            songs.forEach(song => {
                let songElement = document.createElement('div');
                songElement.className = 'song-item';
                
                // Get high quality image by replacing URL text
                let imgUrl = song.artworkUrl100.replace('100x100bb', '200x200bb');

                songElement.innerHTML = `
                    <img src="${imgUrl}" alt="cover">
                    <div class="song-info">
                        <h4>${song.trackName}</h4>
                        <p>${song.artistName}</p>
                    </div>
                `;

                // Add Click Event to Play Online Stream URL
                songElement.onclick = () => playOnlineStream(song.previewUrl, song.trackName, song.artistName, imgUrl);
                
                resultsContainer.appendChild(songElement);
            });
        }

        // Play Online URL
        function playOnlineStream(streamUrl, title, artist, img) {
            // Update Bottom Player UI
            document.getElementById('now-playing-title').innerText = title;
            document.getElementById('now-playing-artist').innerText = artist;
            document.getElementById('now-playing-img').src = img;

            // Set audio source to Online URL and Play
            audio.src = streamUrl;
            audio.play();
            
            isPlaying = true;
            playBtn.innerText = "⏸️";
        }

        // Play/Pause Toggle
        function togglePlay() {
            if (!audio.src) return; // No song loaded
            
            if (isPlaying) {
                audio.pause();
                playBtn.innerText = "▶️";
            } else {
                audio.play();
                playBtn.innerText = "⏸️";
            }
            isPlaying = !isPlaying;
        }

        // When song ends naturally
        audio.onended = function() {
            isPlaying = false;
            playBtn.innerText = "▶️";
        };
    </script>
</body>
</html>
