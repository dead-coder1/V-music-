<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-Music | Bypass Proxy Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-blur: blur(60px); --easing: cubic-bezier(0.25, 0.8, 0.25, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* UI Views */
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.5s var(--easing), opacity 0.4s ease; z-index: 1; }
        
        /* 1. Search View */
        #searchView { padding: 40px 20px 100px; overflow-y: auto; z-index: 10; background: #000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-title { font-size: 34px; font-weight: 800; }
        .settings-btn { font-size: 24px; color: #8e8e93; cursor: pointer; }
        
        .search-bar { background: #1c1c1e; border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; margin-bottom: 20px; }
        .search-bar input { flex: 1; background: transparent; border: none; color: #fff; font-size: 17px; margin-left: 10px; outline: none; }
        
        .song-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .song-item img { width: 52px; height: 52px; border-radius: 8px; margin-right: 15px; object-fit: cover; }
        .song-info { flex: 1; overflow: hidden; }
        .song-info h4 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { font-size: 14px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 2. Settings Overlay (Bypass VPN) */
        #settingsView { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; background: rgba(0,0,0,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 40px 20px; }
        #settingsView.active { opacity: 1; pointer-events: auto; }
        .settings-card { background: #1c1c1e; border-radius: 16px; padding: 20px; margin-top: 20px; }
        .settings-card h3 { margin-bottom: 15px; font-size: 18px; color: #ff3b30; }
        .server-option { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 16px; }
        .server-option:last-child { border-bottom: none; }
        .server-option input[type="radio"] { transform: scale(1.3); accent-color: #ff3b30; }
        .close-settings { margin-top: 30px; background: #fff; color: #000; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* 3. Mini Player */
        #miniPlayer { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 64px; background: rgba(40,40,40,0.85); backdrop-filter: blur(25px); border-radius: 16px; display: flex; align-items: center; padding: 0 15px; z-index: 50; transform: translateY(150%); transition: transform 0.4s var(--easing); cursor: pointer; }
        #miniPlayer.active { transform: translateY(0); }
        #miniCover { width: 44px; height: 44px; border-radius: 8px; margin-right: 12px; object-fit: cover; }
        
        /* 4. Full Player View */
        #fullPlayer { z-index: 100; transform: translateY(100%); display: flex; flex-direction: column; }
        #fullPlayer.active { transform: translateY(0); }
        .player-bg { position: absolute; top: -20%; left: -20%; width: 140%; height: 140%; background-size: cover; filter: var(--primary-blur) brightness(0.4); z-index: -1; transition: background-image 0.6s ease; }
        .drag-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 5px; margin: 20px auto; cursor: pointer; }
        
        .art-container { width: 100%; max-width: 340px; aspect-ratio: 1/1; margin: 30px auto; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; transition: transform 0.5s var(--easing); }
        .art-container.playing { transform: scale(1.04); }
        .art-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .controls-wrapper { padding: 0 30px; margin-top: auto; margin-bottom: 60px; }
        .track-titles h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-titles p { font-size: 18px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-area { margin: 30px 0; }
        .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 6px; position: relative; }
        .bar-fill { width: 0%; height: 100%; background: #fff; border-radius: 6px; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 10px; }

        .play-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 30px; }
        .play-controls i { font-size: 32px; color: #fff; cursor: pointer; }
        .play-controls .btn-play { font-size: 48px; }

        /* 5. Lyrics View */
        #lyricsView { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 110; background: rgba(0,0,0,0.5); backdrop-filter: blur(50px); display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        #lyricsView.active { opacity: 1; pointer-events: auto; }
        #lyricsContainer { flex: 1; overflow-y: auto; padding: 120px 20px 50vh; scroll-behavior: smooth; }
        #lyricsContainer::-webkit-scrollbar { display: none; }
        
        .lyric-line { font-size: 32px; font-weight: 700; margin-bottom: 30px; line-height: 1.3; transform-origin: left; transition: transform 0.4s var(--easing); --fill: 0%; background: linear-gradient(90deg, #fff var(--fill), rgba(255,255,255,0.25) var(--fill)); -webkit-background-clip: text; color: transparent; will-change: background; }
        .lyric-line.active { transform: scale(1.05); }

        .loader { text-align: center; color: #8e8e93; font-weight: 500; margin-top: 30px; display: none; }
    </style>
</head>
<body>

    <!-- BYPASS SETTINGS OVERLAY -->
    <div id="settingsView">
        <h2 style="font-size: 28px; font-weight: 800;">Network Setup</h2>
        <p style="color: #8e8e93; margin-top: 5px;">Configure bypass proxy if songs fail to load.</p>
        
        <div class="settings-card">
            <h3>Audio Proxy Server</h3>
            <label class="server-option">
                Direct (No Bypass)
                <input type="radio" name="proxy" value="direct" checked>
            </label>
            <label class="server-option">
                Bypass Server 1 (CORSProxy)
                <input type="radio" name="proxy" value="corsproxy">
            </label>
            <label class="server-option">
                Bypass Server 2 (CodeTabs)
                <input type="radio" name="proxy" value="codetabs">
            </label>
        </div>
        <div class="close-settings" id="closeSettingsBtn">Save & Close</div>
    </div>

    <!-- SEARCH VIEW -->
    <div id="searchView" class="view">
        <div class="header-top">
            <h1 class="header-title">Search</h1>
            <i class="fas fa-cog settings-btn" id="openSettingsBtn"></i>
        </div>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="inputSearch" placeholder="Search songs...">
        </div>
        <div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Fetching from Servers...</div>
        <div id="resultList"></div>
    </div>

    <!-- MINI PLAYER -->
    <div id="miniPlayer">
        <img id="mCover" src="">
        <div class="song-info" id="openFull" style="margin-right: 15px;">
            <h4 id="mTitle">Title</h4>
        </div>
        <i class="fas fa-play" id="mPlay" style="font-size: 22px;"></i>
    </div>

    <!-- FULL PLAYER -->
    <div id="fullPlayer" class="view">
        <div class="player-bg" id="pBg"></div>
        <div class="drag-handle" id="closeFull"></div>
        
        <div id="lyricsView">
            <div class="drag-handle" id="closeLyrics" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 120;"></div>
            <div id="lyricsContainer"><div style="text-align:center; color:#8e8e93; margin-top:30vh;">Awaiting Track...</div></div>
        </div>

        <div class="art-container" id="artBox"><img id="fCover" src=""></div>

        <div class="controls-wrapper">
            <div class="track-titles">
                <h2 id="fTitle">Title</h2>
                <p id="fArtist">Artist</p>
            </div>
            
            <div class="progress-area" id="progressBar">
                <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
                <div class="time-stamps"><span id="tCurr">0:00</span><span id="tDur">0:00</span></div>
            </div>

            <div class="play-controls">
                <i class="fas fa-backward-step" id="btnPrev"></i>
                <i class="fas fa-play btn-play" id="btnPlay"></i>
                <i class="fas fa-forward-step" id="btnNext"></i>
            </div>
            
            <div style="text-align:center;">
                <i class="fas fa-quote-left" id="btnLyrics" style="font-size: 22px; color: rgba(255,255,255,0.5); cursor:pointer;"></i>
            </div>
        </div>
    </div>

    <script>
        class BypassMusicEngine {
            constructor() {
                this.audio = new Audio();
                this.tracks = [];
                this.currentIndex = 0;
                this.isPlaying = false;
                this.lyricsData = [];
                this.activeProxy = 'direct'; // Default network setting

                this.DOM = {
                    input: document.getElementById('inputSearch'),
                    results: document.getElementById('resultList'),
                    loader: document.getElementById('loader'),
                    miniPlayer: document.getElementById('miniPlayer'),
                    mPlay: document.getElementById('mPlay'),
                    fullPlayer: document.getElementById('fullPlayer'),
                    btnPlay: document.getElementById('btnPlay'),
                    artBox: document.getElementById('artBox'),
                    pBg: document.getElementById('pBg'),
                    barFill: document.getElementById('barFill'),
                    tCurr: document.getElementById('tCurr'),
                    tDur: document.getElementById('tDur'),
                    lyricsView: document.getElementById('lyricsView'),
                    lyricsContainer: document.getElementById('lyricsContainer'),
                    settingsView: document.getElementById('settingsView')
                };

                this.initListeners();
                this.startRenderLoop();
            }

            initListeners() {
                // Settings UI Logic
                document.getElementById('openSettingsBtn').onclick = () => this.DOM.settingsView.classList.add('active');
                document.getElementById('closeSettingsBtn').onclick = () => {
                    this.activeProxy = document.querySelector('input[name="proxy"]:checked').value;
                    this.DOM.settingsView.classList.remove('active');
                };

                this.DOM.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && this.DOM.input.value.trim()) {
                        this.searchSongs(this.DOM.input.value.trim());
                    }
                });

                const toggle = (e) => { e.stopPropagation(); this.togglePlayback(); };
                this.DOM.mPlay.onclick = toggle;
                this.DOM.btnPlay.onclick = toggle;
                
                document.getElementById('btnPrev').onclick = () => this.playNextPrev(-1);
                document.getElementById('btnNext').onclick = () => this.playNextPrev(1);
                this.audio.onended = () => this.playNextPrev(1);

                document.getElementById('openFull').onclick = () => this.DOM.fullPlayer.classList.add('active');
                document.getElementById('closeFull').onclick = () => this.DOM.fullPlayer.classList.remove('active');
                document.getElementById('btnLyrics').onclick = () => this.DOM.lyricsView.classList.add('active');
                document.getElementById('closeLyrics').onclick = () => this.DOM.lyricsView.classList.remove('active');
                
                document.getElementById('progressBar').onclick = (e) => {
                    if(this.audio.src) {
                        const rect = document.getElementById('progressBar').getBoundingClientRect();
                        this.audio.currentTime = ((e.clientX - rect.left) / rect.width) * this.audio.duration;
                    }
                };
            }

            // Proxy URL Formatter
            getProxiedUrl(url) {
                if (!url) return '';
                if (this.activeProxy === 'corsproxy') return `https://corsproxy.io/?${encodeURIComponent(url)}`;
                if (this.activeProxy === 'codetabs') return `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`;
                return url; // Direct
            }

            async searchSongs(query) {
                this.DOM.loader.style.display = 'block';
                this.DOM.results.innerHTML = '';
                
                // Advanced JioSaavn Endpoint API
                const apiUrl = `https://jiosaavn-api-v3.vercel.app/search/songs?query=${encodeURIComponent(query)}`;
                const requestUrl = this.activeProxy !== 'direct' ? this.getProxiedUrl(apiUrl) : apiUrl;

                try {
                    const res = await fetch(requestUrl);
                    const json = await res.json();
                    
                    let rawResults = [];
                    if (json.status === "SUCCESS" && json.data?.results) rawResults = json.data.results;
                    else if (json.success && json.data?.results) rawResults = json.data.results;

                    if (rawResults.length > 0) {
                        this.tracks = rawResults.map(t => {
                            let img = t.image && t.image.length ? t.image[t.image.length-1].url || t.image[t.image.length-1].link : 'https://via.placeholder.com/500';
                            let audioUrl = t.downloadUrl && t.downloadUrl.length ? t.downloadUrl[t.downloadUrl.length-1].url || t.downloadUrl[t.downloadUrl.length-1].link : '';
                            
                            // Audio Decryption & HD Upgrade
                            if (audioUrl) {
                                audioUrl = audioUrl.replace(/preview\.saavncdn\.com/g, 'aac.saavncdn.com')
                                                 .replace(/_96_p\.mp4|_160_p\.mp4/g, '_320.mp4');
                            }
                            
                            let artist = t.primary_artists || (t.artists?.primary ? t.artists.primary.map(a=>a.name).join(', ') : "Unknown");
                            return { name: (t.name || t.title).replace(/&quot;/g, '"'), artist, img, src: audioUrl };
                        }).filter(t => t.src); 

                        if(this.tracks.length) this.renderList();
                        else this.DOM.results.innerHTML = '<p style="color:#ff3b30; text-align:center;">No valid audio found.</p>';
                    } else {
                        this.DOM.results.innerHTML = '<p style="color:#ff3b30; text-align:center;">No results found.</p>';
                    }
                } catch (error) {
                    this.DOM.results.innerHTML = '<p style="color:#ff3b30; text-align:center;">Server Blocked. Open Settings ⚙️ and change Bypass Server.</p>';
                }
                this.DOM.loader.style.display = 'none';
            }

            renderList() {
                this.DOM.results.innerHTML = this.tracks.map((t, i) => `
                    <div class="song-item" onclick="player.loadTrack(${i})">
                        <img src="${t.img}">
                        <div class="song-info"><h4>${t.name}</h4><p>${t.artist}</p></div>
                    </div>
                `).join('');
            }

            loadTrack(index) {
                this.currentIndex = index;
                const track = this.tracks[index];
                
                document.getElementById('mTitle').innerText = track.name;
                document.getElementById('fTitle').innerText = track.name;
                document.getElementById('fArtist').innerText = track.artist;
                document.getElementById('mCover').src = track.img;
                document.getElementById('fCover').src = track.img;
                this.DOM.pBg.style.backgroundImage = `url('${track.img}')`;
                
                this.DOM.miniPlayer.classList.add('active');
                
                // Applying Proxy to the Audio Source
                this.audio.src = this.getProxiedUrl(track.src);
                this.audio.load();
                this.setPlayState(true);
                
                this.fetchLyricsAPI(track.name, track.artist);
            }

            togglePlayback() { this.setPlayState(!this.isPlaying); }
            
            setPlayState(state) {
                this.isPlaying = state;
                const icon = this.isPlaying ? 'fa-pause' : 'fa-play';
                this.DOM.mPlay.className = `fas ${icon}`;
                this.DOM.btnPlay.className = `fas ${icon} btn-play`;
                
                if (this.isPlaying) {
                    this.audio.play();
                    this.DOM.artBox.classList.add('playing');
                } else {
                    this.audio.pause();
                    this.DOM.artBox.classList.remove('playing');
                }
            }

            playNextPrev(step) {
                if(!this.tracks.length) return;
                this.currentIndex = (this.currentIndex + step + this.tracks.length) % this.tracks.length;
                this.loadTrack(this.currentIndex);
            }

            // LYRICS
            async fetchLyricsAPI(name, artist) {
                this.lyricsData = [];
                this.DOM.lyricsContainer.innerHTML = '<div class="loader" style="display:block;">Syncing...</div>';
                try {
                    let cleanArtist = artist.split(',')[0];
                    let url = `https://lrclib.net/api/search?track_name=${encodeURIComponent(name)}&artist_name=${encodeURIComponent(cleanArtist)}`;
                    
                    const res = await fetch(this.getProxiedUrl(url));
                    const data = await res.json();
                    
                    if(data && data.length > 0 && data[0].syncedLyrics) {
                        const lines = data[0].syncedLyrics.split('\n');
                        lines.forEach(line => {
                            const m = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
                            if(m && m[4].trim()) {
                                let time = parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/(m[3].length===3?1000:100);
                                this.lyricsData.push({ time, text: m[4].trim(), el: null });
                            }
                        });
                        this.renderLyrics();
                    } else {
                        this.DOM.lyricsContainer.innerHTML = '<div class="loader" style="display:block;">Lyrics not found</div>';
                    }
                } catch(e) { this.DOM.lyricsContainer.innerHTML = '<div class="loader" style="display:block;">Lyrics Engine Blocked. Use Bypass Server.</div>'; }
            }

            renderLyrics() {
                this.DOM.lyricsContainer.innerHTML = '';
                this.lyricsData.forEach((l) => {
                    let div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.innerText = l.text;
                    l.el = div;
                    this.DOM.lyricsContainer.appendChild(div);
                });
                let spacer = document.createElement('div'); spacer.style.height = "50vh";
                this.DOM.lyricsContainer.appendChild(spacer);
            }

            // ENGINE LOOP
            startRenderLoop() {
                const formatTime = (time) => {
                    let m = Math.floor(time / 60), s = Math.floor(time % 60);
                    return `${m}:${s < 10 ? '0'+s : s}`;
                };

                const loop = () => {
                    if (this.audio.duration) {
                        const curr = this.audio.currentTime;
                        this.DOM.barFill.style.width = `${(curr / this.audio.duration) * 100}%`;
                        this.DOM.tCurr.innerText = formatTime(curr);
                        this.DOM.tDur.innerText = formatTime(this.audio.duration);

                        if (this.lyricsData.length > 0 && this.DOM.lyricsView.classList.contains('active')) {
                            let activeIdx = this.lyricsData.findIndex((l, i, arr) => curr >= l.time - 0.2 && (!arr[i+1] || curr < arr[i+1].time - 0.2));
                            
                            if (activeIdx !== -1) {
                                let activeData = this.lyricsData[activeIdx];
                                
                                this.lyricsData.forEach((l, i) => {
                                    if(i !== activeIdx && l.el.classList.contains('active')) {
                                        l.el.classList.remove('active');
                                        l.el.style.setProperty('--fill', '0%');
                                    }
                                });

                                if (!activeData.el.classList.contains('active')) {
                                    activeData.el.classList.add('active');
                                    this.DOM.lyricsContainer.scrollTo({
                                        top: activeData.el.offsetTop - (this.DOM.lyricsContainer.clientHeight / 2) + 50,
                                        behavior: 'smooth'
                                    });
                                }

                                let nextTime = this.lyricsData[activeIdx + 1] ? this.lyricsData[activeIdx + 1].time : activeData.time + 3;
                                let duration = nextTime - activeData.time;
                                let percentage = Math.max(0, Math.min(100, ((curr - activeData.time) / duration) * 100));
                                
                                activeData.el.style.setProperty('--fill', `${percentage}%`);
                            }
                        }
                    }
                    requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            }
        }

        const player = new BypassMusicEngine();
    </script>
</body>
</html>
