<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            color: #E1306C; /* Instagram Pink */
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #282828;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #E1306C;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
        }
        button:active {
            background: #C13584;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #FFDC80;
        }
        .result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .media-card {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .media-card img, .media-card video {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .download-btn {
            background: #405DE6;
            width: 100%;
            display: inline-block;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">InstaSaver Pro</div>

    <div class="search-box">
        <input type="text" id="username" placeholder="Instagram Username (e.g. cristiano)">
        <div class="btn-group">
            <button onclick="fetchData('stories')">Stories</button>
            <button onclick="fetchData('reels')">Reels</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="result-container" id="results">
        <!-- Videos or Images yahan show honge -->
    </div>

    <script>
        // NOTE: Aapko RapidAPI se ek free Instagram Scraper API key leni hogi
        const API_KEY = 'YAHAN_APNI_RAPIDAPI_KEY_DALEIN'; 
        const API_HOST = 'instagram-scraper-api2.p.rapidapi.com'; // Example host

        async function fetchData(type) {
            const username = document.getElementById('username').value.trim();
            const statusBox = document.getElementById('status');
            const resultsBox = document.getElementById('results');

            if (!username) {
                statusBox.innerText = "Pehle username dalein!";
                return;
            }

            statusBox.innerText = `Fetching ${type} for @${username}... Please wait.`;
            resultsBox.innerHTML = '';

            // Example RapidAPI Endpoint URL (Yeh API par depend karta hai)
            const url = `https://${API_HOST}/v1/${type}?username=${username}`;

            const options = {
                method: 'GET',
                headers: {
                    'X-RapidAPI-Key': API_KEY,
                    'X-RapidAPI-Host': API_HOST
                }
            };

            try {
                // Fetch data from API
                const response = await fetch(url, options);
                const data = await response.json();

                statusBox.innerText = "Data loaded successfully!";
                
                // Yahan API ke response ke hisaab se data show karein
                // Example ke liye maan lijiye data.items me media links hain
                if(data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        let mediaHtml = '';
                        
                        if(item.video_url) {
                            mediaHtml = `<video controls src="${item.video_url}"></video>`;
                        } else {
                            mediaHtml = `<img src="${item.image_url}" alt="Post">`;
                        }

                        let downloadLink = item.video_url ? item.video_url : item.image_url;

                        const card = `
                            <div class="media-card">
                                ${mediaHtml}
                                <a href="${downloadLink}" target="_blank" class="download-btn" download>Download</a>
                            </div>
                        `;
                        resultsBox.innerHTML += card;
                    });
                } else {
                    statusBox.innerText = "Koi data nahi mila ya account private hai.";
                }

            } catch (error) {
                console.error(error);
                statusBox.innerText = "Error! API key check karein ya internet connection dekhein.";
            }
        }
    </script>
</body>
</html>
