<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player-container {
            background-color: #1e1e1e;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .cover-art {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #1db954, #191414);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }
        .cover-art.playing {
            animation-play-state: running;
        }
        .cover-art span {
            font-size: 50px;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .track-info h2 {
            font-size: 22px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-info p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }
        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            background: #404040;
            border-radius: 5px;
            margin: 0 10px;
            outline: none;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #1db954;
            border-radius: 50%;
            cursor: pointer;
        }
        .time {
            font-size: 12px;
            color: #b3b3b3;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.9);
        }
        .play-btn {
            font-size: 40px;
            color: #1db954;
        }
        .file-upload {
            background-color: #282828;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .file-upload input {
            color: #ffffff;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="cover-art" id="cover">
            <span>🎵</span>
        </div>
        
        <div class="track-info">
            <h2 id="title">No Song Selected</h2>
            <p id="artist">Upload music below</p>
        </div>

        <div class="progress-container">
            <span class="time" id="current-time">0:00</span>
            <input type="range" class="progress-bar" id="progress" value="0" step="1">
            <span class="time" id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="btn" id="prev" onclick="prevSong()">⏮️</button>
            <button class="btn play-btn" id="play" onclick="togglePlay()">▶️</button>
            <button class="btn" id="next" onclick="nextSong()">⏭️</button>
        </div>

        <div class="file-upload">
            <input type="file" id="audio-upload" accept="audio/*" multiple>
        </div>
    </div>

    <audio id="audio"></audio>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const title = document.getElementById('title');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const cover = document.getElementById('cover');
        const audioUpload = document.getElementById('audio-upload');

        let playlist = [];
        let currentSongIndex = 0;
        let isPlaying = false;

        // Load files from device
        audioUpload.addEventListener('change', function(event) {
            const files = event.target.files;
            if (files.length > 0) {
                playlist = [];
                for (let i = 0; i < files.length; i++) {
                    playlist.push(files[i]);
                }
                currentSongIndex = 0;
                loadSong(playlist[currentSongIndex]);
            }
        });

        function loadSong(file) {
            title.innerText = file.name.replace(/\.[^/.]+$/, ""); // Remove extension
            audio.src = URL.createObjectURL(file);
            progress.value = 0;
            if (isPlaying) {
                audio.play();
            }
        }

        function togglePlay() {
            if (playlist.length === 0) return alert("Pehle niche se gaane select karein!");
            
            if (isPlaying) {
                audio.pause();
                playBtn.innerText = '▶️';
                cover.classList.remove('playing');
            } else {
                audio.play();
                playBtn.innerText = '⏸️';
                cover.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        function nextSong() {
            if (playlist.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(playlist[currentSongIndex]);
            if (!isPlaying) togglePlay();
        }

        function prevSong() {
            if (playlist.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(playlist[currentSongIndex]);
            if (!isPlaying) togglePlay();
        }

        // Update Progress Bar
        audio.addEventListener('timeupdate', updateProgress);

        function updateProgress() {
            const { duration, currentTime } = audio;
            if (duration) {
                progress.max = duration;
                progress.value = currentTime;
                
                let currentMinutes = Math.floor(currentTime / 60);
                let currentSeconds = Math.floor(currentTime % 60);
                if(currentSeconds < 10) currentSeconds = "0" + currentSeconds;
                currentTimeEl.innerText = `${currentMinutes}:${currentSeconds}`;

                let durationMinutes = Math.floor(duration / 60);
                let durationSeconds = Math.floor(duration % 60);
                if(durationSeconds < 10) durationSeconds = "0" + durationSeconds;
                durationEl.innerText = `${durationMinutes}:${durationSeconds}`;
            }
        }

        // Seek Audio
        progress.addEventListener('input', () => {
            audio.currentTime = progress.value;
        });

        // Auto play next song
        audio.addEventListener('ended', nextSong);
    </script>
</body>
</html>
