<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booo!! Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --easing: cubic-bezier(0.22, 1, 0.36, 1);
            --glass: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
            --glass-border: rgba(255, 255, 255, 0.22);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: #030306; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }

        #hiddenAudioCore { position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.001; pointer-events: none; z-index: -10; }

        .ambient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #030306; }
        .amb-orb {
            position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.4;
            background-size: cover; background-position: center; will-change: transform;
            animation: ambientFloat 20s infinite alternate ease-in-out;
        }
        .orb-1 { width: 320px; height: 320px; top: -10%; left: -10%; background-color: #ff2d55; }
        .orb-2 { width: 350px; height: 350px; bottom: -12%; right: -10%; background-color: #5e5ce6; animation-delay: -6s; }
        @keyframes ambientFloat { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(25px, -20px, 0) scale(1.1); } }

        /* --- AUTH SCREEN --- */
        #authScreen {
            position: fixed; inset: 0; z-index: 9000;
            background: radial-gradient(circle at 50% 20%, #1a0b2e 0%, #030306 75%);
            display: flex; align-items: center; justify-content: center; padding: 22px;
            transition: opacity 0.4s ease, transform 0.4s var(--easing);
        }
        #authScreen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .auth-glass-card {
            width: 100%; max-width: 360px; padding: 30px 24px 26px; border-radius: 30px;
            background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
            backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); text-align: center;
        }
        .auth-title { font-size: 24px; font-weight: 900; margin-top: 14px; margin-bottom: 4px; }
        .auth-sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
        .auth-input {
            width: 100%; padding: 13px 16px; border-radius: 16px; background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 15px; font-weight: 600; outline: none; margin-bottom: 12px;
        }
        .password-warning-box {
            padding: 11px 14px; border-radius: 14px; margin-bottom: 18px;
            background: rgba(255, 59, 48, 0.16); border: 1px solid rgba(255, 59, 48, 0.45);
            color: #ff6961; font-size: 12px; font-weight: 700; text-align: left; display: flex; gap: 9px;
        }
        .auth-submit-btn {
            width: 100%; padding: 14px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, #ff2d55, #bf5af2); color: #fff; font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        #authErrorMsg { color: #ff453a; font-size: 12.5px; font-weight: 700; margin-bottom: 10px; display: none; }

        /* --- TOP BAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 40;
            padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(3,3,6,0.92) 0%, rgba(3,3,6,0) 100%); backdrop-filter: blur(12px);
        }
        .booo-edge-box {
            position: relative; padding: 2.2px; border-radius: 20px; overflow: hidden; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.55); display: inline-flex; align-items: center; justify-content: center;
        }
        .booo-edge-box::before {
            content: ''; position: absolute; width: 260%; height: 260%; top: -80%; left: -80%;
            background: conic-gradient(from 0deg, #ff2d55, #ff9f0a, #30d158, #00f2fe, #5e5ce6, #bf5af2, #ff2d55);
            animation: edgeSpin 2.8s linear infinite; z-index: 0;
        }
        @keyframes edgeSpin { 100% { transform: rotate(360deg); } }
        .booo-inner-glass {
            position: relative; z-index: 1; padding: 6px 16px; border-radius: 18px;
            background: rgba(12, 12, 20, 0.88); backdrop-filter: blur(20px); font-size: 19px; font-weight: 900; color: #fff;
        }

        .nav-actions { display: flex; align-items: center; gap: 6px; }
        .glass-pill {
            padding: 8px 11px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; cursor: pointer;
        }
        .glass-pill.admin-pill { background: linear-gradient(135deg, rgba(255, 214, 10, 0.25), rgba(255, 159, 10, 0.1)); border-color: rgba(255, 214, 10, 0.55); color: #ffd60a; display: none; }
        .glass-pill i.fa-instagram { font-size: 14px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); -webkit-background-clip: text; color: transparent; }
        .glass-pill i.fa-users-rays { color: #30d158; font-size: 12px; }
        .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #30d158; display: none; }
        .sync-dot.online { display: inline-block; }

        /* --- MAIN APP SCROLL --- */
        .main-scroll { position: relative; z-index: 10; height: 100vh; overflow-y: auto; padding: 74px 18px 160px; scroll-behavior: smooth; }
        .main-scroll::-webkit-scrollbar { display: none; }

        .search-box {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.18);
            border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; margin-bottom: 20px; box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        }
        .search-box i { color: rgba(255,255,255,0.55); font-size: 15px; }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15.5px; margin-left: 10px; outline: none; }
        .search-go { background: linear-gradient(135deg, #ff2d55, #bf5af2); border: none; color: #fff; padding: 8px 16px; border-radius: 12px; font-weight: 800; font-size: 12.5px; cursor: pointer; }

        .user-library-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 20px; }
        .lib-tab-btn {
            flex: 1; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
            display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 800; cursor: pointer;
        }
        .lib-tab-btn.active { background: rgba(255, 45, 85, 0.22); border-color: #ff2d55; }
        .like-count-pill { background: rgba(255, 45, 85, 0.25); color: #ff2d55; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 900; }

        .hero-banner {
            position: relative; width: 100%; height: 210px; border-radius: 26px; overflow: hidden; margin-bottom: 24px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 20px 45px rgba(0,0,0,0.6);
        }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay {
            position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 15%, rgba(3,3,6,0.92) 100%);
            padding: 18px 20px; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 4px 10px; border-radius: 12px;
            font-size: 10px; font-weight: 800; background: rgba(255, 45, 85, 0.28); border: 1px solid rgba(255, 45, 85, 0.55); color: #fff; margin-bottom: 8px;
        }
        .hero-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        .hero-info h2 { font-size: 23px; font-weight: 900; margin-bottom: 3px; }
        .hero-info p { font-size: 13.5px; color: rgba(255,255,255,0.75); }
        .hero-play-fab { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 17px; }

        .section-heading { font-size: 19px; font-weight: 800; margin-bottom: 13px; display: flex; justify-content: space-between; align-items: center; }
        .section-sub { font-size: 11.5px; color: rgba(255,255,255,0.48); font-weight: 700; text-transform: uppercase; }

        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
        .quick-card { display: flex; align-items: center; padding: 6px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; overflow: hidden; }
        .quick-card img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; margin-right: 10px; flex-shrink: 0; }
        .quick-card-text h4 { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .quick-card-text p { font-size: 11px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .carousel-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 26px; }
        .carousel-scroll::-webkit-scrollbar { display: none; }
        .album-card { width: 142px; flex-shrink: 0; cursor: pointer; }
        .album-art-wrap { position: relative; width: 142px; height: 142px; border-radius: 18px; overflow: hidden; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.14); }
        .album-art-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .hd-chip { position: absolute; bottom: 7px; right: 7px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,0.65); font-size: 9px; font-weight: 800; color: #fff; }
        .album-card h4 { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card p { font-size: 12px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .song-row {
            display: flex; align-items: center; padding: 10px 12px; margin-bottom: 10px; border-radius: 16px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); cursor: pointer;
        }
        .song-row img { width: 52px; height: 52px; border-radius: 12px; margin-right: 14px; object-fit: cover; }
        .song-meta { flex: 1; overflow: hidden; }
        .song-meta h4 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .song-meta p { font-size: 13px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-actions { display: flex; align-items: center; gap: 10px; }
        .heart-btn { font-size: 17px; color: rgba(255,255,255,0.35); padding: 6px; }
        .heart-btn.liked { color: #ff2d55; transform: scale(1.15); }
        .play-circle { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }

        .support-card {
            margin-top: 22px; padding: 18px; border-radius: 22px; background: var(--glass); border: 1px solid var(--glass-border); text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .support-card h4 { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; }
        .insta-grid { display: flex; gap: 10px; }
        .insta-chip { flex: 1; padding: 11px 10px; border-radius: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }

        /* --- SUPER ADMIN DASHBOARD --- */
        #superAdminScreen {
            position: fixed; inset: 0; z-index: 550; background: rgba(4, 4, 9, 0.96); backdrop-filter: blur(40px);
            transform: translateY(100%); transition: transform 0.4s var(--easing); display: flex; flex-direction: column; padding: 20px 18px 28px; overflow-y: auto;
        }
        #superAdminScreen.active { transform: translateY(0); }
        .admin-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .admin-stat-box { padding: 14px 10px; border-radius: 18px; text-align: center; background: linear-gradient(145deg, rgba(255,214,10,0.14), rgba(255,255,255,0.03)); border: 1px solid rgba(255,214,10,0.3); }
        .admin-stat-num { font-size: 22px; font-weight: 900; color: #ffd60a; }
        .admin-stat-lbl { font-size: 10.5px; color: rgba(255,255,255,0.65); font-weight: 700; margin-top: 3px; }
        .user-db-card { padding: 12px; border-radius: 16px; margin-bottom: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .user-db-meta h4 { font-size: 14.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .user-db-meta p { font-size: 11.5px; color: rgba(255,255,255,0.55); margin-top: 3px; }

        /* --- LISTEN TOGETHER SCREEN --- */
        #listenRoomScreen {
            position: fixed; inset: 0; z-index: 500; background: rgba(5, 5, 10, 0.96); backdrop-filter: blur(35px);
            transform: translateY(100%); transition: transform 0.4s var(--easing); display: flex; flex-direction: column; padding: 20px 20px 24px; overflow-y: auto;
        }
        #listenRoomScreen.active { transform: translateY(0); }
        .room-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .room-private-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 14px; background: rgba(48, 209, 88, 0.16); border: 1px solid rgba(48, 209, 88, 0.45); color: #30d158; font-size: 11.5px; font-weight: 800; }
        .room-box-card { padding: 20px 18px; border-radius: 24px; margin-bottom: 16px; background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .room-input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); background: rgba(0,0,0,0.45); color: #fff; font-size: 15px; font-weight: 800; text-align: center; letter-spacing: 2px; outline: none; margin: 8px 0 12px; }
        .room-action-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 15px; font-weight: 800; font-size: 14px; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
        .member-list-box { max-height: 200px; overflow-y: auto; margin-top: 10px; border-radius: 16px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; }
        .member-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .member-row:last-child { border-bottom: none; }
        .member-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .admin-tag { font-size: 10px; padding: 2px 7px; border-radius: 8px; background: #ffd60a; color: #000; font-weight: 900; }
        .kick-btn { padding: 5px 12px; border-radius: 10px; background: rgba(255, 59, 48, 0.22); border: 1px solid #ff3b30; color: #ff453a; font-size: 11.5px; font-weight: 800; cursor: pointer; }

        .coded-by-vishal-box { margin: auto auto 0; padding: 8px 20px; border-radius: 18px; background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04)); border: 1px solid rgba(255,255,255,0.28); font-size: 12px; font-weight: 800; color: #fff; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 8px 20px rgba(0,0,0,0.45); }

        /* --- SUPPORT MODAL --- */
        .glass-modal { position: fixed; inset: 0; z-index: 600; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 18px; }
        .glass-modal.active { opacity: 1; pointer-events: auto; }
        .modal-glass-card { width: 100%; max-width: 340px; padding: 24px 20px; border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,0.17), rgba(255,255,255,0.04)); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.28); text-align: center; }
        .modal-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 13px 16px; margin-bottom: 10px; border-radius: 15px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; }

        /* --- MINI & FULL PLAYERS --- */
        #miniPlayer {
            position: fixed; bottom: 14px; left: 14px; right: 14px; height: 64px;
            background: linear-gradient(135deg, rgba(45,45,55,0.9), rgba(18,18,26,0.96)); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.22); border-radius: 20px; display: flex; align-items: center; padding: 0 14px; z-index: 50;
            transform: translateY(150%); transition: transform 0.4s var(--easing); cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        #miniPlayer.active { transform: translateY(0); }
        #mCover { width: 46px; height: 46px; border-radius: 12px; margin-right: 12px; object-fit: cover; }

        #fullPlayer {
            position: fixed; inset: 0; z-index: 200; transform: translateY(100%); transition: transform 0.5s var(--easing);
            display: flex; flex-direction: column; background: rgba(6, 6, 10, 0.9); backdrop-filter: blur(40px); overflow: hidden;
        }
        #fullPlayer.active { transform: translateY(0); }

        .player-ambient-layer { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .flow-orb {
            position: absolute; width: 130%; height: 130%; top: -15%; left: -15%; background-size: cover; background-position: center;
            filter: blur(55px) saturate(200%) brightness(0.42); will-change: transform; animation: spinFlow 24s infinite linear;
        }
        @keyframes spinFlow { 100% { transform: rotate(360deg); } }

        .player-top-bar { padding: 18px 22px 8px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
        .drag-pill { width: 42px; height: 5px; background: rgba(255,255,255,0.38); border-radius: 5px; cursor: pointer; }

        .art-box {
            width: 76%; max-width: 300px; aspect-ratio: 1/1; margin: 12px auto; border-radius: 26px; overflow: hidden;
            box-shadow: 0
